name: Security

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: ${{ matrix.scanner }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        scanner: [foxguard, gitleaks, zizmor]
    steps:
      - name: Check out repository and full history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Foxguard
        if: matrix.scanner == 'foxguard'
        run: cargo install foxguard --locked --version 0.12.0

      - name: Install Gitleaks
        if: matrix.scanner == 'gitleaks'
        run: |
          go install github.com/zricethezav/gitleaks/v8@v8.30.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Install zizmor
        if: matrix.scanner == 'zizmor'
        run: |
          python3 -m venv "$RUNNER_TEMP/zizmor"
          "$RUNNER_TEMP/zizmor/bin/pip" install zizmor==1.32.0
          echo "$RUNNER_TEMP/zizmor/bin" >> "$GITHUB_PATH"

      - name: Scan source
        if: matrix.scanner == 'foxguard'
        run: foxguard .

      - name: Scan Git history for secrets
        if: matrix.scanner == 'gitleaks'
        run: gitleaks git --redact --no-banner

      - name: Scan current files for secrets
        if: ${{ !cancelled() && matrix.scanner == 'gitleaks' }}
        run: gitleaks dir --redact --no-banner .

      - name: Audit GitHub Actions
        if: matrix.scanner == 'zizmor'
        run: zizmor --offline --no-progress .
